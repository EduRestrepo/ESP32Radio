; PlatformIO Project Configuration File for TinyRadio (ESP32-C3 Mini)
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting

[platformio]
default_envs = esp32-c3-devkitm-1
data_dir = data

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Monitor and Upload settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default
upload_port = COM4
monitor_port = COM4

; Flash & Board settings for ESP32-C3 (e.g. Super Mini / DevKitM-1)
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv

; Build flags
build_flags = 
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Dependencies
lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.4
    https://github.com/schreibfaul1/ESP32-audioI2S/archive/refs/tags/3.0.12.zip
